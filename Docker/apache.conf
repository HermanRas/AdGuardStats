# Only /app/public is served. Health checks are left out of the access log.
<VirtualHost *:80>
    DocumentRoot /app/public
    <Directory /app/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

    SetEnvIf Request_URI "^/api/health\.php$" dontlog
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!dontlog
</VirtualHost>
